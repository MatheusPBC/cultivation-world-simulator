name: Docker Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -r requirements.txt pytest
      - run: pytest -m docker tests/test_docker_runtime_smoke.py -v

  docker-frontend-browser-smoke:
    needs: docker-runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - run: docker compose -p cws-browser-smoke up -d --build
      - run: curl --fail --retry 60 --retry-delay 2 http://127.0.0.1:8123/api/health
      - working-directory: web
        env: {CWS_SMOKE_BASE_URL: "http://127.0.0.1:8123", CWS_SMOKE_SKIP_WEBSERVER: "1"}
        run: npm run smoke:production
      - if: always()
        run: docker compose -p cws-browser-smoke down -v --remove-orphans
