name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  medieval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -r requirements.txt pytest pytest-cov pytest-xdist
      - run: pytest -m "not docker" tests/test_medieval_*.py -v --cov=src/sim/medieval --cov-report=term --cov-fail-under=60
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run type-check && npm run test:run && npm run build
      - name: Start isolated Medieval API
        env:
          CWS_DATA_DIR: ${{ runner.temp }}/cws-medieval-api
        run: |
          mkdir -p "$CWS_DATA_DIR"
          uvicorn src.server.main:app --host 127.0.0.1 --port 8002 > "$RUNNER_TEMP/medieval-api.log" 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:8002/api/health && exit 0 || sleep 1; done
          cat "$RUNNER_TEMP/medieval-api.log"
          exit 1
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        env: {CWS_SMOKE_BASE_URL: "http://127.0.0.1:4173"}
        run: npm run smoke:production
